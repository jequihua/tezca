[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tezca"
version = "0.1.0.dev0"
description = "Standalone, provenance-aware environmental time-series analysis"
readme = "08_pkg/README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.3,<7"]
models = ["scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["08_pkg/src"]
include = ["tezca*"]

[tool.setuptools.package-data]
tezca = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
